<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b1329">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pipeline Tracker — Rajat Khandelwal</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(26, 36, 56, 0.85);
      --card-border: rgba(59, 130, 246, 0.25);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --error: #f43f5e;
      --error-bg: rgba(244, 63, 94, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(59, 130, 246, 0.18), transparent 55%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.12), transparent 45%);
      overflow: hidden;
    }
    .lock-card {
      width: 90%;
      max-width: 420px;
      padding: 36px 30px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 30px rgba(59, 130, 246, 0.1);
      text-align: center;
      transition: transform 0.2s ease, opacity 0.3s ease;
      z-index: 10;
    }
    .icon-container {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(147, 51, 234, 0.2));
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }
    .icon-container svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: #60a5fa;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 26px;
      line-height: 1.4;
    }
    .input-wrapper {
      position: relative;
      margin-bottom: 16px;
    }
    .pin-input {
      width: 100%;
      padding: 14px 44px 14px 18px;
      background: rgba(15, 23, 42, 0.7);
      border: 1.5px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      font-size: 18px;
      color: #fff;
      letter-spacing: 3px;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
    }
    .pin-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
      background: rgba(15, 23, 42, 0.9);
    }
    .toggle-visibility {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
    }
    .toggle-visibility svg {
      width: 18px;
      height: 18px;
    }
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      font-size: 13px;
      color: var(--text-muted);
      padding: 0 4px;
    }
    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .remember-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .unlock-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.5);
    }
    .unlock-btn:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px -4px rgba(37, 99, 235, 0.65);
    }
    .unlock-btn:active {
      transform: translateY(0);
    }
    .error-msg {
      display: none;
      background: var(--error-bg);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: var(--error);
      font-size: 13px;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 16px;
      animation: shake 0.3s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .badge-info {
      font-size: 11px;
      color: #64748b;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    /* Dashboard view container */
    #dashboardFrame {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 100;
      background: #f8fafc;
    }
    .lock-floating-pill {
      display: none;
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      z-index: 1000;
      transition: all 0.2s ease;
      align-items: center;
      gap: 6px;
    }
    .lock-floating-pill:hover {
      background: #1e293b;
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="lock-card" id="lockCard">
    <div class="icon-container">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h1>Job Pipeline Tracker</h1>
    <p class="subtitle">Rajat Khandelwal &middot; Private Cloud Access<br><span style="font-size:11px; color:#60a5fa;">AES-256-GCM Encrypted</span></p>

    <div class="error-msg" id="errorMsg">Invalid PIN. Please try again.</div>

    <form onsubmit="handleUnlock(event)">
      <div class="input-wrapper">
        <input 
          type="password" 
          id="pinInput" 
          class="pin-input" 
          placeholder="Enter PIN" 
          inputmode="numeric" 
          autofocus 
          autocomplete="off"
        >
        <button type="button" class="toggle-visibility" onclick="toggleVisibility()" title="Toggle visibility">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <div class="options-row">
        <label class="remember-label">
          <input type="checkbox" id="rememberMe">
          <span>Remember on this device</span>
        </label>
      </div>

      <button type="submit" class="unlock-btn" id="unlockBtn">Unlock Dashboard</button>
    </form>

    <div class="badge-info">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      Decrypted locally in browser memory
    </div>
  </div>

  <iframe id="dashboardFrame"></iframe>
  
  <button class="lock-floating-pill" id="lockPill" onclick="relock()">
    <span>🔒</span> Lock Session
  </button>

    function toggleVisibility() {
      const input = document.getElementById('pinInput');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function decryptDashboard(pin) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(pin),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      const saltBytes = Uint8Array.from(atob(PAYLOAD.salt), c => c.charCodeAt(0));
      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBytes,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const ivBytes = Uint8Array.from(atob(PAYLOAD.iv), c => c.charCodeAt(0));
      const cipherBytes = Uint8Array.from(atob(PAYLOAD.ciphertext), c => c.charCodeAt(0));

      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: ivBytes },
        key,
        cipherBytes
      );

      return new TextDecoder().decode(decrypted);
    }

    async function handleUnlock(e) {
      if (e) e.preventDefault();
      const pin = document.getElementById('pinInput').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const unlockBtn = document.getElementById('unlockBtn');

      if (!pin) {
        errorMsg.textContent = 'Please enter your PIN.';
        errorMsg.style.display = 'block';
        return;
      }

      errorMsg.style.display = 'none';
      unlockBtn.textContent = 'Decrypting...';
      unlockBtn.disabled = true;

      try {
        const html = await decryptDashboard(pin);

        if (document.getElementById('rememberMe').checked) {
          localStorage.setItem('pipeline_pin', pin);
        } else {
          sessionStorage.setItem('pipeline_pin', pin);
        }

        renderDashboard(html);
      } catch (err) {
        console.error(err);
        errorMsg.textContent = 'Invalid PIN. Decryption failed.';
        errorMsg.style.display = 'block';
        unlockBtn.textContent = 'Unlock Dashboard';
        unlockBtn.disabled = false;
        document.getElementById('pinInput').select();
      }
    }

    function renderDashboard(html) {
      const frame = document.getElementById('dashboardFrame');
      const card = document.getElementById('lockCard');
      const pill = document.getElementById('lockPill');

      frame.srcdoc = html;
      frame.style.display = 'block';
      card.style.display = 'none';
      pill.style.display = 'flex';
      document.body.style.background = '#f8fafc';
    }

    function relock() {
      localStorage.removeItem('pipeline_pin');
      sessionStorage.removeItem('pipeline_pin');
      location.reload();
    }

    // Auto-unlock if PIN stored
    window.addEventListener('DOMContentLoaded', async () => {
      const saved = localStorage.getItem('pipeline_pin') || sessionStorage.getItem('pipeline_pin');
      if (saved) {
        document.getElementById('pinInput').value = saved;
        document.getElementById('rememberMe').checked = !!localStorage.getItem('pipeline_pin');
        try {
          const html = await decryptDashboard(saved);
          renderDashboard(html);
        } catch (err) {
          localStorage.removeItem('pipeline_pin');
          sessionStorage.removeItem('pipeline_pin');
        }
      }
    });
  </script>
